<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventSync - Smart Event Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --purple:#7c3aed;
    --navy:#0f172a;
    --navy2:#1e293b;
    --bg:#f5f7fb;
    --white:#fff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --success:#16a34a;
    --warning:#f59e0b;
    --danger:#dc2626;
    --info:#0891b2;
    --shadow:0 10px 30px rgba(15,23,42,.08);
    --radius:16px;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,input,select,textarea{font-family:inherit}

button{cursor:pointer}

.hidden{display:none!important}

#app{min-height:100vh}

/* LOGIN */
.login-page{
    min-height:100vh;
    display:flex;
    background:
        radial-gradient(circle at 15% 20%,rgba(37,99,235,.15),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(124,58,237,.13),transparent 30%),
        #f8fafc;
}

.login-left{
    width:52%;
    background:linear-gradient(145deg,#0f172a,#172554);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px;
    position:relative;
    overflow:hidden;
}

.login-left:after{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    border:80px solid rgba(255,255,255,.04);
    border-radius:50%;
    right:-180px;
    bottom:-180px;
}

.login-brand{
    max-width:550px;
    position:relative;
    z-index:2;
}

.brand-big{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:34px;
    font-weight:800;
    margin-bottom:40px;
}

.brand-icon{
    width:52px;
    height:52px;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 12px 30px rgba(37,99,235,.35);
}

.login-brand h1{
    font-size:48px;
    line-height:1.1;
    margin-bottom:20px;
}

.login-brand p{
    color:#cbd5e1;
    line-height:1.8;
    font-size:17px;
}

.feature-list{
    margin-top:35px;
    display:grid;
    gap:14px;
}

.feature-list div{
    display:flex;
    align-items:center;
    gap:12px;
    color:#e2e8f0;
}

.feature-list i{color:#60a5fa}

.login-right{
    width:48%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.login-card{
    width:100%;
    max-width:440px;
    background:white;
    border:1px solid var(--border);
    border-radius:22px;
    padding:40px;
    box-shadow:var(--shadow);
}

.login-card h2{font-size:28px;margin-bottom:8px}
.login-card .subtitle{color:var(--muted);margin-bottom:30px}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

.input-wrap{position:relative}

.input-wrap i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
}

.input-wrap input{
    width:100%;
    padding:13px 14px 13px 42px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    font-size:14px;
}

.input-wrap input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.btn{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn:hover{transform:translateY(-1px)}

.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-dark)}

.btn-purple{background:var(--purple);color:white}
.btn-success{background:var(--success);color:white}
.btn-danger{background:var(--danger);color:white}
.btn-warning{background:var(--warning);color:white}

.btn-outline{
    background:white;
    color:var(--text);
    border:1px solid var(--border);
}

.btn-block{width:100%}

.demo-box{
    margin-top:24px;
    padding:15px;
    background:#f8fafc;
    border:1px dashed #cbd5e1;
    border-radius:12px;
}

.demo-box strong{font-size:13px}

.demo-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.demo-buttons button{
    border:1px solid var(--border);
    background:white;
    border-radius:8px;
    padding:9px;
    font-size:12px;
    font-weight:700;
}

/* APP LAYOUT */
.app-layout{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:260px;
    background:var(--navy);
    color:white;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    transition:.3s;
}

.sidebar-header{
    padding:24px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.sidebar-logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:800;
}

.sidebar-logo .brand-icon{
    width:38px;
    height:38px;
    font-size:15px;
}

.sidebar-nav{
    padding:20px 12px;
    flex:1;
    overflow-y:auto;
}

.nav-label{
    color:#64748b;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    padding:12px 12px 8px;
    letter-spacing:1px;
}

.nav-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    border:none;
    background:transparent;
    color:#cbd5e1;
    padding:12px;
    margin:3px 0;
    border-radius:10px;
    text-align:left;
    font-size:13px;
    font-weight:600;
}

.nav-item i{width:20px;text-align:center}

.nav-item:hover,
.nav-item.active{
    background:#1e40af;
    color:white;
}

.sidebar-footer{
    padding:15px;
    border-top:1px solid rgba(255,255,255,.08);
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:800;
    font-size:13px;
}

.user-mini small{color:#94a3b8;font-size:11px}

.main{
    margin-left:260px;
    width:calc(100% - 260px);
    min-height:100vh;
}

.topbar{
    height:72px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:500;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.mobile-menu{
    display:none;
    border:none;
    background:none;
    font-size:20px;
}

.topbar h2{font-size:18px}

.topbar-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.role-badge{
    background:#eff6ff;
    color:var(--primary);
    padding:7px 12px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.content{
    padding:30px;
    max-width:1600px;
    margin:auto;
}

/* GENERAL */
.page-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.page-title h1{font-size:27px}
.page-title p{color:var(--muted);font-size:13px;margin-top:5px}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 5px 20px rgba(15,23,42,.04);
}

.stat-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.stat-icon{
    width:42px;
    height:42px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.stat-icon.blue{background:#dbeafe;color:#2563eb}
.stat-icon.purple{background:#ede9fe;color:#7c3aed}
.stat-icon.green{background:#dcfce7;color:#16a34a}
.stat-icon.orange{background:#fef3c7;color:#d97706}
.stat-icon.red{background:#fee2e2;color:#dc2626}

.stat-card h3{font-size:28px}
.stat-card p{font-size:12px;color:var(--muted);margin-top:5px}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 5px 20px rgba(15,23,42,.04);
    overflow:hidden;
}

.card-header{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.card-header h3{font-size:15px}
.card-body{padding:20px}

.table-wrap{overflow-x:auto}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#f8fafc;
    color:#64748b;
    font-size:11px;
    text-align:left;
    padding:12px 15px;
    text-transform:uppercase;
    letter-spacing:.4px;
}

td{
    padding:14px 15px;
    border-top:1px solid #f1f5f9;
    font-size:13px;
}

tr:hover td{background:#fafcff}

.status{
    display:inline-flex;
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.status-upcoming{background:#dbeafe;color:#1d4ed8}
.status-ongoing{background:#dcfce7;color:#15803d}
.status-completed{background:#f1f5f9;color:#64748b}
.status-conflict{background:#fee2e2;color:#b91c1c}

.empty{
    text-align:center;
    padding:45px 20px;
    color:var(--muted);
}

.empty i{
    font-size:40px;
    margin-bottom:12px;
    color:#cbd5e1;
}

/* EVENT CARDS */
.event-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.event-card{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
    transition:.2s;
}

.event-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
}

.event-image{
    height:150px;
    background:linear-gradient(135deg,#1e3a8a,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:45px;
    overflow:hidden;
}

.event-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.event-info{padding:18px}

.event-info h3{
    font-size:16px;
    margin-bottom:8px;
}

.event-category{
    display:inline-block;
    font-size:10px;
    background:#eef2ff;
    color:#4f46e5;
    padding:5px 8px;
    border-radius:20px;
    font-weight:800;
    margin-bottom:10px;
}

.event-meta{
    display:grid;
    gap:8px;
    color:var(--muted);
    font-size:11px;
    margin:13px 0;
}

.event-meta div{
    display:flex;
    gap:8px;
}

.event-meta i{width:15px;color:var(--primary)}

.event-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.event-actions .btn{
    flex:1;
    padding:8px;
    font-size:11px;
}

/* FORMS */
.form-card{
    max-width:950px;
    margin:auto;
    background:white;
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.form-group{display:flex;flex-direction:column;gap:7px}
.form-group.full{grid-column:1/-1}

.form-group label{
    font-size:12px;
    font-weight:700;
}

.form-control{
    width:100%;
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px 13px;
    outline:none;
    font-size:13px;
    background:white;
}

.form-control:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

textarea.form-control{min-height:110px;resize:vertical}

.form-actions{
    margin-top:25px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* FILTER */
.filter-bar{
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.filter-bar .form-control{
    max-width:230px;
}

.search-wrap{
    position:relative;
    flex:1;
    min-width:200px;
}

.search-wrap i{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
}

.search-wrap input{padding-left:36px}

/* VENUES */
.venue-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.venue-card{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:20px;
}

.venue-icon{
    width:45px;
    height:45px;
    border-radius:12px;
    background:#eff6ff;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
}

.venue-card h3{font-size:16px}
.venue-location{font-size:11px;color:var(--muted);margin:6px 0 14px}

.facilities{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-bottom:18px;
}

.facility{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:20px;
    padding:5px 8px;
    font-size:10px;
    color:#475569;
}

.venue-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid var(--border);
    padding-top:15px;
}

/* SCHEDULE */
.schedule-list{display:grid;gap:12px}

.schedule-item{
    display:grid;
    grid-template-columns:100px 1fr 180px;
    align-items:center;
    gap:15px;
    padding:15px;
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
}

.schedule-date{
    text-align:center;
    background:#eff6ff;
    color:var(--primary);
    border-radius:10px;
    padding:10px;
}

.schedule-date strong{display:block;font-size:19px}
.schedule-date small{font-size:9px;font-weight:700}

.schedule-main h3{font-size:14px}
.schedule-main p{font-size:11px;color:var(--muted);margin-top:5px}

.schedule-venue{
    text-align:right;
    color:var(--muted);
    font-size:11px;
}

/* ANALYTICS */
.chart-card{
    min-height:340px;
}

.chart-box{
    position:relative;
    height:270px;
}

/* MODAL */
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.68);
    backdrop-filter:blur(5px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:5000;
}

.modal{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
    animation:modalIn .2s ease;
}

@keyframes modalIn{
    from{opacity:0;transform:translateY(15px) scale(.98)}
    to{opacity:1;transform:none}
}

.modal-header{
    padding:20px 24px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{font-size:18px}

.modal-close{
    width:34px;
    height:34px;
    border:none;
    background:#f1f5f9;
    border-radius:8px;
}

.modal-body{padding:24px}
.modal-footer{
    padding:18px 24px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* CONFLICT */
.conflict-header{
    background:#fff7ed;
    border:1px solid #fed7aa;
    padding:18px;
    border-radius:12px;
    display:flex;
    gap:14px;
    align-items:flex-start;
}

.conflict-icon{
    width:42px;
    height:42px;
    flex-shrink:0;
    border-radius:50%;
    background:#ffedd5;
    color:#ea580c;
    display:flex;
    align-items:center;
    justify-content:center;
}

.conflict-header h3{color:#9a3412;margin-bottom:4px}
.conflict-header p{font-size:12px;color:#7c2d12}

.conflict-details{
    margin-top:18px;
    display:grid;
    gap:10px;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:11px;
    background:#f8fafc;
    border-radius:8px;
    font-size:12px;
}

.detail-row span:first-child{color:var(--muted)}
.detail-row strong{text-align:right}

.suggestion-title{
    margin:22px 0 10px;
    font-size:13px;
    font-weight:800;
}

.suggestions{display:grid;gap:8px}

.suggestion{
    width:100%;
    text-align:left;
    background:#f8fafc;
    border:1px solid var(--border);
    padding:12px 14px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:700;
    font-size:12px;
}

.suggestion:hover{
    border-color:var(--primary);
    background:#eff6ff;
    color:var(--primary);
}

/* PROFILE */
.profile-card{
    max-width:700px;
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:30px;
    margin:auto;
}

.profile-top{
    display:flex;
    align-items:center;
    gap:20px;
    padding-bottom:25px;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
}

.profile-avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.profile-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.profile-detail{
    padding:14px;
    background:#f8fafc;
    border-radius:10px;
}

.profile-detail label{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:5px;
}

.profile-detail strong{font-size:13px}

/* TOAST */
#toastContainer{
    position:fixed;
    right:20px;
    top:85px;
    z-index:10000;
    display:flex;
    flex-direction:column;
    gap:10px;
    width:min(360px,calc(100% - 40px));
}

.toast{
    background:white;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(15,23,42,.15);
    padding:14px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    border-left:4px solid var(--primary);
    animation:toastIn .25s ease;
}

@keyframes toastIn{
    from{opacity:0;transform:translateX(30px)}
    to{opacity:1;transform:none}
}

.toast i{font-size:17px;margin-top:2px}
.toast strong{display:block;font-size:12px;margin-bottom:3px}
.toast span{font-size:11px;color:var(--muted)}

.toast.success{border-color:var(--success)}
.toast.success i{color:var(--success)}
.toast.error{border-color:var(--danger)}
.toast.error i{color:var(--danger)}
.toast.warning{border-color:var(--warning)}
.toast.warning i{color:var(--warning)}

/* RESPONSIVE */
@media(max-width:1200px){
    .stats-grid{grid-template-columns:repeat(3,1fr)}

/* =========================================================
   UTILITIES
   ========================================================= */

function uid(prefix="id") {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatDate(date) {
    if (!date) return "-";
    return new Date(date + "T00:00:00").toLocaleDateString("en-IN", {
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}

function formatTime(time) {
    if (!time) return "-";
    const [h,m] = time.split(":");
    const d = new Date();
    d.setHours(Number(h),Number(m),0,0);
    return d.toLocaleTimeString("en-IN", {
        hour:"2-digit",
        minute:"2-digit"
    });
}

function getVenue(id) {
    return getData(STORAGE.VENUES).find(v => v.id === id);
}

function getEvent(id) {
    return getData(STORAGE.EVENTS).find(e => e.id === id);
}

function getEventRegistrations(eventId) {
    return getData(STORAGE.REGISTRATIONS).filter(r => r.eventId === eventId);
}

function eventStatus(event) {
    const now = new Date();
    const start = new Date(`${event.date}T${event.startTime}`);
    const end = new Date(`${event.date}T${event.endTime}`);

    if (now < start) return "Upcoming";
    if (now >= start && now <= end) return "Ongoing";
    return "Completed";
}

function statusBadge(status) {
    const cls = status.toLowerCase();
    return `<span class="status status-${cls}">${status}</span>`;
}

/* =========================================================
   TOAST
   ========================================================= */

function toast(message, type="success", title="Notification") {
    const container = document.getElementById("toastContainer");

    const icon = {
        success:"fa-circle-check",
        error:"fa-circle-xmark",
        warning:"fa-triangle-exclamation",
        info:"fa-circle-info"
    }[type] || "fa-circle-info";

    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.innerHTML = `
        <i class="fa-solid ${icon}"></i>
        <div>
            <strong>${escapeHTML(title)}</strong>
            <span>${escapeHTML(message)}</span>
        </div>
    `;

    container.appendChild(el);

    setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateX(30px)";
        setTimeout(() => el.remove(),250);
    },3500);
}

    setData(STORAGE.SESSION,{
        userId:user.id,
        role:user.role,
        loginAt:new Date().toISOString()

    setTimeout(() => {
        renderApplication();
    },300);

    if (!events.length) {

    return events.map(e => {

}

function filterEvents() {

    const venue = document.getElementById("eventVenueFilter").value;
    const date = document.getElementById("eventDateFilter").value;

        const matchSearch =
            e.name.toLowerCase().includes(search) ||
            e.description.toLowerCase().includes(search) ||
            e.organizer.toLowerCase().includes(search);

        return matchSearch &&
            (!category || e.category === category) &&
            (!venue || e.venueId === venue) &&
            (!date || e.date === date);
    });

    document.getElementById("eventsGrid").innerHTML =
        events.length
        ? events.map(eventCard).join("")
        : `<div class="empty" style="grid-column:1/-1">

function handleEventSubmit(e) {
    e.preventDefault();

    const name = document.getElementById("eventName").value.trim();
    const description = document.getElementById("eventDescription").value.trim();
    const category = document.getElementById("eventCategory").value;
    const date = document.getElementById("eventDate").value;
    const startTime = document.getElementById("eventStart").value;
    const endTime = document.getElementById("eventEnd").value;
    const venueId = document.getElementById("eventVenue").value;
    const organizer = document.getElementById("eventOrganizer").value.trim();
    const maxParticipants = Number(document.getElementById("eventMax").value);
    const image = document.getElementById("eventImage").value.trim();

    if (!name || !description || !category || !date || !startTime ||
        !endTime || !venueId || !organizer) {

    }

    if (endTime <= startTime) {
        toast("End time must be after start time.","error","Invalid Time");
        return;
    }

    if (maxParticipants <= 0) {
        toast("Maximum participants must be greater than zero.","error","Invalid Capacity");
        return;

    const venue = getVenue(venueId);

    if (!venue) {
        toast("Please select a valid venue.","error","Invalid Venue");

    if (maxParticipants > venue.capacity) {
        toast(
            `${venue.name} can accommodate only ${venue.capacity} participants.`,
            "error",

        );
        return;
    }

    const conflict = findConflict({
        id:editingEventId,
        date,
        startTime,
        endTime,
        venueId

    if (conflict) {
        showConflictModal({
            requested:{
                name,
                date,
                startTime,
                endTime,
                venueId
            },
            conflict
        });
        return;
    }

    saveEvent({
        name,
        description,
        category,
        date,
        startTime,
        endTime,
        venueId,
        organizer,
        maxParticipants,
        image
    });

/* =========================================================
   CONFLICT DETECTION
   ========================================================= */

function timesOverlap(start1,end1,start2,end2) {
    return start1 < end2 && end1 > start2;
}

function findConflict(candidate) {
    return getData(STORAGE.EVENTS).find(e => {
        if (candidate.id && e.id === candidate.id) return false;

        return e.date === candidate.date &&
            e.venueId === candidate.venueId &&
            timesOverlap(
                candidate.startTime,
                candidate.endTime,
                e.startTime,
                e.endTime
            );
    });
}

function calculateAllConflicts() {
    const events = getData(STORAGE.EVENTS);
    const conflicts = [];

    for (let i=0;i<events.length;i++) {
        for (let j=i+1;j<events.length;j++) {
            const a=events[i];
            const b=events[j];

            if (
                a.date === b.date &&
                a.venueId === b.venueId &&
                timesOverlap(a.startTime,a.endTime,b.startTime,b.endTime)
            ) {
                conflicts.push({
                    a:a.id,
                    b:b.id
                });
            }
        }
    }

    return conflicts;
}

function generateSuggestions(date,venueId,durationMinutes=120) {
    const events = getData(STORAGE.EVENTS)
        .filter(e => e.date === date && e.venueId === venueId);

    const slots = [
        ["09:00","11:00"],
        ["11:00","13:00"],
        ["13:00","15:00"],
        ["15:00","17:00"],
        ["17:00","19:00"],
        ["19:00","21:00"]
    ];

    return slots.filter(([start,end]) => {
        return !events.some(e =>
            timesOverlap(start,end,e.startTime,e.endTime)
        );
    }).slice(0,3);
}

function participantRows(registrations) {

                <td>${escapeHTML(r.department)}</td>

                        onclick="deleteRegistration('${r.id}')">

    }).join("");
}

function filterParticipants() {
    const search = document.getElementById("participantSearch").value.toLowerCase();
    const eventId = document.getElementById("participantEventFilter").value;

    const regs = getData(STORAGE.REGISTRATIONS).filter(r=>{
        return (
            r.studentName.toLowerCase().includes(search) ||
            r.studentId.toLowerCase().includes(search) ||
            r.email.toLowerCase().includes(search)
        ) && (!eventId || r.eventId===eventId);

    document.getElementById("participantsBody").innerHTML = participantRows(regs);
}

function deleteRegistration(id) {
    const regs=getData(STORAGE.REGISTRATIONS);

    setData(STORAGE.REGISTRATIONS,regs.filter(r=>r.id!==id));

    renderParticipants();
}

function renderAnalytics() {
    const events=getData(STORAGE.EVENTS);
    const regs=getData(STORAGE.REGISTRATIONS);
    const venues=getData(STORAGE.VENUES);

    const avg=events.length ? (regs.length/events.length).toFixed(1) : 0;

    const venueCounts=venues.map(v=>({
        name:v.name,
        count:events.filter(e=>e.venueId===v.id).length
    }));

    const mostUsed=venueCounts.sort((a,b)=>b.count-a.count)[0];

    const categoryCounts={};
    events.forEach(e=>{
        categoryCounts[e.category]=(categoryCounts[e.category]||0)+1;
    });

    const popularCategory=Object.entries(categoryCounts)
        .sort((a,b)=>b[1]-a[1])[0]?.[0] || "-";

    document.getElementById("pageContent").innerHTML = `

            <div>
                <h1>Analytics</h1>

            ${statCard("Registrations",regs.length,"fa-ticket","green")}
            ${statCard("Avg Participants",avg,"fa-users","purple")}
            ${statCard("Most Used Venue",mostUsed?.name || "-","fa-building","orange")}
            ${statCard("Popular Category",popularCategory,"fa-fire","red")}

        <div class="grid-2">

   ========================================================= */

function openRegistration(eventId) {
    const event=getEvent(eventId);
    const user=window.currentUser;

    if (!event) return;

    const count=getEventRegistrations(eventId).length;

    if (count>=event.maxParticipants) {
        toast("This event has reached maximum capacity.","warning","Registration Full");
        return;
    }

    const duplicate=getData(STORAGE.REGISTRATIONS).some(
        r=>r.eventId===eventId && r.studentId===user.studentId
    );

    if (duplicate) {
        toast("You are already registered for this event.","warning","Already Registered");
        return;
    }

    showModal(`
        <div class="modal-header">
            <h2>Register for Event</h2>
            <button class="modal-close" onclick="closeModal('genericModal')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="modal-body">
            <div style="background:#eff6ff;padding:14px;border-radius:10px;margin-bottom:20px">
                <strong style="font-size:14px">${escapeHTML(event.name)}</strong>
                <p style="font-size:11px;color:#64748b;margin-top:5px">
                    ${formatDate(event.date)} · ${formatTime(event.startTime)} - ${formatTime(event.endTime)}
                </p>
            </div>

            <form id="registrationForm">
                <div class="form-group" style="margin-bottom:15px">
                    <label>Student Name *</label>
                    <input id="regName" class="form-control" required
                        value="${escapeHTML(user.name)}">
                </div>

                <div class="form-group" style="margin-bottom:15px">
                    <label>Student ID *</label>
                    <input id="regStudentId" class="form-control" required
                        value="${escapeHTML(user.studentId || "")}">
                </div>

                <div class="form-group" style="margin-bottom:15px">
                    <label>Email *</label>
                    <input id="regEmail" type="email" class="form-control" required
                        value="${escapeHTML(user.email)}">
                </div>

                <div class="form-group" style="margin-bottom:15px">
                    <label>Department *</label>
                    <input id="regDepartment" class="form-control" required
                        value="${escapeHTML(user.department || "")}"
                        placeholder="Computer Science">
                </div>

                <div class="form-group">
                    <label>Year *</label>
                    <select id="regYear" class="form-control" required>
                        <option value="">Select year</option>
                        ${["1st Year","2nd Year","3rd Year","4th Year"]
                            .map(y=>`<option ${user.year===y?"selected":""}>${y}</option>`).join("")}
                    </select>
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('genericModal')">Cancel</button>
            <button class="btn btn-primary" onclick="submitRegistration('${eventId}')">
                <i class="fa-solid fa-ticket"></i> Confirm Registration
            </button>
        </div>
    `);
}

function submitRegistration(eventId) {
    const name=document.getElementById("regName").value.trim();
    const studentId=document.getElementById("regStudentId").value.trim();
    const email=document.getElementById("regEmail").value.trim();
    const department=document.getElementById("regDepartment").value.trim();
    const year=document.getElementById("regYear").value;

    if(!name || !studentId || !email || !department || !year){
        toast("Please complete all registration fields.","error","Validation Error");
        return;
    }

    const event=getEvent(eventId);
    const regs=getData(STORAGE.REGISTRATIONS);

    if(regs.some(r=>r.eventId===eventId && r.studentId===studentId)){
        toast("Duplicate registration is not allowed.","warning","Already Registered");
        return;
    }

    if(regs.filter(r=>r.eventId===eventId).length>=event.maxParticipants){
        toast("Registration is full.","error","Registration Full");
        return;
    }

    regs.push({
        id:uid("r"),
        eventId,
        studentName:name,
        studentId,
        email,
        department,
        year,
        registeredAt:new Date().toISOString(),
        status:"Registered"
    });

    setData(STORAGE.REGISTRATIONS,regs);

    closeModal("genericModal");

    toast(
        `You are registered for ${event.name}.`,
        "success",
        "Registration Successful"
    );

    setTimeout(()=>renderBrowseEvents(),300);
}

                        ${escapeHTML(user.email)}
                    </p>
                </div>
            </div>

            <div class="profile-details">
                <div class="profile-detail">
                    <label>Student ID</label>
                    <strong>${escapeHTML(user.studentId || "-")}</strong>
                </div>

                <div class="profile-detail">
                    <label>Department</label>
                    <strong>${escapeHTML(user.department || "-")}</strong>
                </div>

                <div class="profile-detail">
                    <label>Year</label>
                    <strong>${escapeHTML(user.year || "-")}</strong>
                </div>

                <div class="profile-detail">
                    <label>Registered Events</label>
                    <strong>${count}</strong>
                </div>
            </div>
        </div>
    `;
}

/* =========================================================
   SETTINGS
   ========================================================= */

function renderSettings() {
    document.getElementById("pageContent").innerHTML=`
        <div class="page-title">
            <div>
                <h1>Settings</h1>
                <p>Application and organizer settings.</p>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-header"><h3>Organizer Account</h3></div>
                <div class="card-body">
                    <div class="form-group" style="margin-bottom:15px">
                        <label>Name</label>
                        <input class="form-control" value="${escapeHTML(window.currentUser.name)}" disabled>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input class="form-control" value="${escapeHTML(window.currentUser.email)}" disabled>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3>Application</h3></div>
                <div class="card-body">
                    <p style="font-size:13px;line-height:1.8;color:#64748b">
                        <strong style="color:#172033">EventSync</strong> is a
                        smart college event management and scheduling platform.
                        This demo uses browser LocalStorage for persistence.
                    </p>

                    <div style="margin-top:18px;padding:15px;background:#eff6ff;border-radius:10px;font-size:12px;color:#1d4ed8">
                        <i class="fa-solid fa-database"></i>
                        All demo data is stored locally in your browser.
                    </div>
                </div>
            </div>
        </div>
    `;
}

/* =========================================================
   START APPLICATION
   ========================================================= */

initializeData();

if (getSession()) {
    renderApplication();
} else {
    renderLogin();
}

/* Keep status/statistics fresh when tab becomes active */
setInterval(() => {
    const session=getSession();

    if(!session) return;

    const active=document.querySelector(".nav-item.active");

    if(active && active.dataset.page==="dashboard"){
        renderDashboard();
    }
},60000);

</script>
</body>
</html>
